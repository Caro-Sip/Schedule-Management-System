<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Schedule Management System</h1>
            <div class="header-controls">
                <div class="view-toggle">
                    <button class="view-btn active" data-view="class">Class Schedule</button>
                    <button class="view-btn" data-view="teacher">Teacher Schedule</button>
                    <button class="view-btn" data-view="room">Room Schedule</button>
                </div>
            </div>
        </div>

        <!-- Calendar Controls -->
        <div class="calendar-controls">
            <div class="week-navigation">
                <button id="prevWeek" class="nav-btn">← Previous</button>
                <div class="week-info">
                    <h2 id="currentWeek">Week of Mar 2, 2026</h2>
                    <p id="currentDate"></p>
                </div>
                <button id="nextWeek" class="nav-btn">Next →</button>
            </div>
            <button id="todayBtn" class="today-btn">Today</button>
        </div>

        <!-- Schedule View -->
        <div class="schedule-container">
            <!-- Time Labels -->
            <div class="time-column">
                <div class="time-header"></div>
                <div id="timeLabels" class="time-labels">
                    <!-- Time slots will be generated by JS -->
                </div>
            </div>

            <!-- Days and Events -->
            <div class="calendar-grid">
                <!-- Header with day names -->
                <div class="day-header">
                    <!-- Day names will be generated by JS -->
                </div>

                <!-- Time grid with events -->
                <div id="scheduleGrid" class="schedule-grid">
                    <!-- Time slots and events will be generated by JS -->
                </div>
            </div>
        </div>

        <!-- Event Details Modal -->
        <div id="eventModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Event Details</h2>
                    <button class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Title:</label>
                        <input type="text" id="eventTitle" placeholder="Enter event title">
                    </div>
                    <div class="form-group">
                        <label>Start Time:</label>
                        <input type="time" id="eventStartTime">
                    </div>
                    <div class="form-group">
                        <label>End Time:</label>
                        <input type="time" id="eventEndTime">
                    </div>
                    <div class="form-group">
                        <label>Room:</label>
                        <input type="text" id="eventRoom" placeholder="Enter room number">
                    </div>
                    <div class="form-group">
                        <label>Instructor:</label>
                        <input type="text" id="eventInstructor" placeholder="Enter instructor name">
                    </div>
                    <div class="form-group">
                        <label>Color:</label>
                        <div class="color-picker">
                            <input type="radio" name="color" value="blue" checked> Blue
                            <input type="radio" name="color" value="green"> Green
                            <input type="radio" name="color" value="red"> Red
                            <input type="radio" name="color" value="orange"> Orange
                            <input type="radio" name="color" value="purple"> Purple
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="deleteEventBtn" class="btn btn-danger">Delete</button>
                    <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    <button id="saveEventBtn" class="btn btn-primary">Save Event</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
