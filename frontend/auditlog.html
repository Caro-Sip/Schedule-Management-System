<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schedule Management System – Audit Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="audit-log.css" />
</head>
<body>

  
  <header class="site-header">
    <div class="header-left">
      <h1 class="site-title">Schedule Management System</h1>
      <p class="site-welcome">Welcome , user</p>
    </div>
    <button class="btn-signout">Sign out</button>
  </header>

  
  <nav class="top-nav">
    <a href="index.html" class="nav-link">Class Schedule</a>
    <a href="index.html" class="nav-link">Room Schedule</a>
    <a href="index.html" class="nav-link">User</a>
    <a href="index.html" class="nav-link active">Audit Log</a>
  </nav>


  <main class="page-content">

   
    <div class="page-title-row">
      <div>
        <h2 class="page-title">Audit Log</h2>
        <p class="page-subtitle">Sorted by last modified</p>
      </div>
      <span class="badge-count" id="entryCount">— entries</span>
    </div>

    <!-- Search bar -->
    <div class="search-row">
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search by name or ID"
        />
        <button class="search-clear" id="clearSearch" title="Clear search">✕</button>
      </div>
    </div>

 
    <div class="log-list" id="logList">
     
    </div>

   
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="32" cy="32" r="28"/>
        <line x1="20" y1="20" x2="44" y2="44"/>
        <line x1="44" y1="20" x2="20" y2="44"/>
      </svg>
      <p>No audit log entries match your search.</p>
    </div>

  </main>

  <script src="audit-log.js"></script>
</body>
</html>
